
openapi: 3.0.1
info:
  title: Core Registry Services REST API
  description: This API provides the required operations to manipulate EPP objects in .fr
  contact:
    name: Afnic
    url: 'https://www.afnic.fr'
    email: support@afnic.fr
  license:
    name: Afnic
    url: 'https://www.afnic.fr'
  version: v1
servers:
  - url: 'https://api-sandbox.nic.fr'
    description: Generated server url
paths:
  /v1/domains:
    get:
      tags:
        - domain-registrar-controller
      summary: List registrar's sponsored domains
      operationId: getDomains_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: research
          in: query
          description: string to make a specific search on the domainSearchField
        - name: domainSearchField
          in: query
          description: item you want to search on
          schema:
            default: DOMAIN
            enum:
              - DOMAIN
              - CONTACT
              - HOST
              - CONTACT_REGISTRANT
        - name: stringSearchType
          in: query
          description: search operator
          schema:
            default: LIKE
            enum:
              - EQUALS
              - LIKE
              - START_WITH
              - END_WITH
        - name: startDate
          in: query
          description: define a start date on the domainDateField
        - name: endDate
          in: query
          description: define an end date on the domainDateField
        - name: domainDateField
          in: query
          description: type of date you want to search on
          schema:
            default: CREATION_DATE
            enum:
              - CREATION_DATE
              - UPDATE_DATE
              - EXPIRATION_DATE
        - name: page
          in: query
          description: specify the page number you want to retrieve
        - name: pageSize
          in: query
          description: specify the number of elements by page
        - name: sortAttribute
          in: query
          description: specify the sorting parameter
          schema:
            enum:
              - NAME
              - CREATION_DATE
              - EXPIRATION_DATE
        - name: sortDirection
          in: query
          description: specify the sorting direction
          schema:
            enum:
              - ASC
              - DESC
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListRegistrarResponseDto'
      security:
        - keycloak: []
    post:
      tags:
        - domain-registrar-controller
      summary: Create a Domain object
      operationId: create_12_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (SECDNS_V1_1 to manage dnssec / FEE_V1 to manage fees)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
              enum:
               - SECDNS_V1_1
               - FEE_V1
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Domain object that needs to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreateDto'
            examples:
              create1:
                summary: create a domain
                value: {"authorizationInformation":"Test123456789","contacts":[{"clientId":"CTC42848","role":"ADMINISTRATIVE"},{"clientId":"CTC42849","role":"TECHNICAL"}],"durationInYears":"1","name":"example.fr","registrantClientId":"CTC42847"}
              create2:
                summary: create a domain with hosts
                value: {"authorizationInformation":"Test123456789","nameServers":["ns1.example.org","ns2.example.org"],"contacts":[{"clientId":"CTC42990","role":"ADMINISTRATIVE"},{"clientId":"CTC42990","role":"TECHNICAL"}],"durationInYears":1,"name":"example.fr","registrantClientId":"CTC42990"}
              create3:
                summary: create a domain with an authorization code (authorization code in authinfo field)
                value: {"authorizationInformation":"YL0X9mC3eU2ZUUXWX0UDMRjhlVHX3qKC","contacts":[{"clientId":"CTC43942","role":"ADMINISTRATIVE"},{"clientId":"CTC43942","role":"TECHNICAL"}],"durationInYears":"1","name":"reserved-name.fr","registrantClientId":"CTC43942"}              
              create4:                
                summary: create a domain with fee (FEE_V1 extension required)               
                value: {"authorizationInformation":"Test123456789","contacts":[{"clientId":"CTC43011","role":"ADMINISTRATIVE"},{"clientId":"CTC43012","role":"TECHNICAL"}],"durationInYears":"1","name":"example.fr","registrantClientId":"CTC43010","extensions":{"fee":{"currency":"EUR","value":29.99}}}
              create5:
                summary: create a domain with 1 dnssec and 1 host (SECDNS_V1_1 extension required)
                value: {"authorizationInformation":"Test123456789","nameServers":["ns1.example.net"],"contacts":[{"clientId":"CTC42977","role":"ADMINISTRATIVE"},{"clientId":"CTC42977","role":"TECHNICAL"}],"durationInYears":"1","name":"example.fr","registrantClientId":"CTC42977","extensions":{"dnsSec":[{"keyTag":11627,"algorithm":"RSASHA256","digestType":"SHA256","digest":"2C1BF38D591521CF0ABC7FECFEC11E95BC2F6BE83F2CD6623BB606C51D2EFB3A"}]}}
        required: true
      responses:
        '201':
          description: Successfully created Domain object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCreateResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '404':
          description: 'Not found, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
    patch:
      tags:
        - domain-registrar-controller
      summary: Update a domain (restore included)
      operationId: update_19_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (SECDNS_V1_1 to manage dnssec / FEE_V1 to manage fees / RGP_V1 to manage grace periods - restore operation)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
              enum:
                - SECDNS_V1_1
                - FEE_V1
                - RGP_V1
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Domain object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainUpdateRegistrarDto'
            examples:
              update1:
                summary: adding hosts to the domain
                value: {"name":"example.fr","nameServersToAdd":["ns3.example.org"]}
              update2:
                summary: adding and removing hosts to the domain
                value: {"name":"example.fr","nameServersToRemove":["ns.example.fr"],"nameServersToAdd":["ns1.test.fr"]}
              update3:
                summary: change the registrant contact
                value: {"name":"example.fr","registrantClientId":"CTC277"}
              update4:
                summary: adding and removing administrative contact
                value: {"name":"example.fr","contactsToRemove":[{"clientId":"CTC268","role":"ADMINISTRATIVE"}],"contactsToAdd":[{"clientId":"CTC269","role":"ADMINISTRATIVE"}]}
              update5:
                summary: adding and removing dnssec key (SECDNS_V1_1 extension required)
                value: {"name":"example.fr.fr","extensions":{"dnsSec":{"keysToAdd":[{"keyTag":"31609","algorithm":"DSA","digestType":"GOST","digest":"509646F67513C72ECB24680DD640496837BEB9DF10D58A64D255581FB8651976"}],"keysToRemove":[{"keyTag":55072,"algorithm":"RSASHA1","digestType":"SHA256","digest":"47754C3858DDCA47FC31EBBE2E1EC3961F9C899B2917F3D8A7BFB6F8D57D2162"}]}}}              
              update6:
                summary: adding EPP client status
                value: {"name":"example.fr","eppStatusesToAdd":["CLIENT_TRANSFER_PROHIBITED"]}
              restore:
                summary: restore a domain name in redemption period (RGP_V1 extension required)
                value: {"name":"example.fr","extensions":{"rgp":{"type":"REQUEST"}}}
        required: true
      responses:
        '200':
          description: Successfully updated domain object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainUpdateRegistrarResponseDto'
        '400':
          description: 'Bad request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
        '404':
          description: 'Not found, please check your command'
          content:
            application/json:
              schema:
                type: string
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
      security:
        - keycloak: []
  /v1/domains/{domainName}:
    delete:
      tags:
        - domain-registrar-controller
      summary: Delete a domain object
      operationId: delete_12_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: domainName
          in: path
          description: name of the domain object to be deleted
          required: true
          schema:
            type: string
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FEE_V1 to manage fees)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
              enum:
               - FEE_V1
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: Request to delete the Domain object has successfully been treated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDeleteResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/domains/check:
    post:
      tags:
        - domain-registrar-controller
      summary: Check domain name's availability
      operationId: check_3_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FRNIC_V2 to manage .fr specific data / FEE_V1 to manage fees)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
              enum:
                - FRNIC_V2
                - FEE_V1
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: The list of domain names to look for
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCheckDto'
            examples:
              check1:
                summary: An example of domain check with one domain name
                value: {"names": ["example.fr"]}
              check2:  
                summary: An example of domain check with several domain names
                value: {"names": ["example.fr","example2.fr","example3.fr"]}
        required: true
      responses:
        '200':
          description: Successfully check for domain name's availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCheckResponseDto'
        '400':
          description: 'Bad request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
      security:
        - keycloak: []
  /v1/domains/transfers:
    get:
      tags:
        - domain-registrar-controller
      summary: List domain transfers
      operationId: transferList_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: domain
          in: query
          description: string which relate to the domain name you want to search
        - name: stringSearchType
          in: query
          description: operator of the domain search
          schema:
            default: LIKE
            enum:
              - EQUALS
              - LIKE
        - name: transferStatus
          in: query
          description: type of transfer status you want to search
          schema:
            enum:
              - CLIENT_APPROVED
              - CLIENT_CANCELLED
              - CLIENT_REJECTED
              - PENDING
              - SERVER_APPROVED
              - SERVER_CANCELLED
        - name: sortAttribute
          in: query
          description: sorting attribute
          schema:
            default: NAME
            enum:
              - NAME
              - CREATION_DATE
              - UPDATE_DATE
        - name: sortDirection
          in: query
          description: sorting direction
          schema:
            enum:
              - ASC
              - DESC
        - name: registrarRole
          in: query
          description: role of the registrar in the transfer - ACTING = Outgoing registrar / REQUESTING = Ingoing registrar
          schema:
            enum:
              - ACTING
              - REQUESTING
        - name: page
          in: query
          description: select the page number you want
        - name: pageSize
          in: query
          description: select the number of elements by page
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: Successfully executed transfer operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainTransferListResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
    post:
      tags:
        - domain-registrar-controller
      summary: Transfer domain operations
      operationId: transfer_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FRNIC_V2 to manage .fr specific data / FEE_V1 to manage fees)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: stringstring
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Domain transfer command
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainTransferDto'
            examples:
              transfer1:
                summary: requesting a domain transfer (FRNIC_V2 needed)
                value: {"operation":"REQUEST","name":"example.fr","durationInYears":1,"authorizationInformation":"Test123456789","extensions":{"frnic":{"keepDnsSec":0,"contacts":[{"clientId":"CTC1137","role":"ADMINISTRATIVE"},{"clientId":"CTC1137","role":"TECHNICAL"}]}}}
              transfer2:
                summary: requesting a domain with fees extension (FRNIC_V2 needed and FEE_V1 needed)
                value: {"operation":"REQUEST","name":"auto-bar-210518-large-baton-beni-de-la-defaite.afnic","durationInYears":1,"authorizationInformation":"Test123456789","extensions":{"frnic":{"keepDnsSec":0,"contacts":[{"clientId":"CTC1137","role":"ADMINISTRATIVE"},{"clientId":"CTC1137","role":"TECHNICAL"}]},"fee":{"currency":"EUR","value":5.07}}}
        required: true
      responses:
        '201':
          description: Successfully executed transfer operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainTransferResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/domains/{name}:
    get:
      tags:
        - domain-registrar-controller
      summary: Get information on a domain
      operationId: info_25_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: name
          in: path
          description: Domain name to get information on
          required: true
          schema:
            type: string
        - name: hostsType
          in: query
          description: >-
            Hosts attribute is available to control return of information
            describing hosts related to the domain object.
          required: false
          schema:
            default: ALL
        - name: authInfo
          in: header
          description: Authorization information associated with the domain object
          required: false
          schema:
            type: string
        - name: extensions
          in: header
          description: specify an EPP extension if needed (SECDNS_V1_1 to manage dnssec / RGP_V1 to manage grace periods)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: Domain found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainInfoResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/domains/renew:
    post:
      tags:
        - domain-registrar-controller
      summary: Renew domain operations
      operationId: renew_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FEE_V1 to manage fees)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Domain renew command
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainRenewDto'
            examples:
              renew1:
                summary: renew a domain for 1 year
                value: {"name":"example.fr","currentExpirationDate":"2022-05-17","durationInYears":"1"}
              renew2:
                summary: renew a domain for 1 year with fee extension (FEE_V1 is needed)
                value: {"name":"example.fr","currentExpirationDate":"2022-05-17","durationInYears":"1","extensions":{"fee":{"currency":"EUR","value":5.07}}}
        required: true
      responses:
        '201':
          description: Successfully executed renew domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRenewResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/domains/associated-to-host/{hostName}:
    get:
      tags:
        - domain-registrar-controller
      summary: List domain associated to host
      operationId: getDomainsAssociatedToHost_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: hostName
          in: path
          description: name of the host you want to retrieve domain names associated
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: select page number you want
        - name: pageSize
          in: query
          description: select the number of elements you want by page
        - name: sortAttribute
          in: query
          description: sorting attribute
          schema:
            enum:
              - NAME
              - CREATION_DATE
              - EXPIRATION_DATE
        - name: sortDirection
          in: query
          description: sorting direction
          schema:
            enum:
              - ASC
              - DESC
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/DomainListAssociatedToHostRegistrarResponseDto
      security:
        - keycloak: []
  /v1/domains/{domainRoid}/operation-history:
    get:
      tags:
        - domain-registrar-controller
      summary: List operations processed on a domain
      operationId: getDomainHistoryOperations_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: domainRoid
          in: path
          description: Domain roid to get history operation
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: select page number you want
        - name: pageSize
          in: query
          description: select the number of elements you want by page
        - name: sortAttribute
          in: query
          description: sorting attribute
          schema:
            enum:
              - REQUEST_DATE
        - name: sortDirection
          in: query
          description: sorting direction
          schema:
            enum:
              - ASC
              - DESC
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      responses:
        '200':
          description: Successfully retrieved operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectHistoResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/domains/exports:
    post:
      tags:
        - domain-registrar-controller
      summary: Export registrar's sponsored domains - same parameters of the domain list but in the request body
      operationId: export_7_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Domain export request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainExportRegistrarRequestDto'
            examples:
              export1:
                summary: export all domain names with columns by default
                value: {"csvSeparator": ";","fileName": "test.csv"}
              export2:
                summary: export domain names with test in the name, ascending sort by creation date and specific columns
                value: {"csvSeparator": ";","fileName": "test.csv","propertiesOrder": ["NAME","CREATION_DATE","EXPIRATION_DATE","AUTHORIZATION_INFORMATION","REGISTRANT"],"research": "test","domainSearchField": "DOMAIN","stringSearchType": "LIKE"}
              export3:
                summary: example to know all the column names
                value: {"csvSeparator": ";","fileName": "test.csv","propertiesOrder": ["NAME","CREATION_DATE","EXPIRATION_DATE","AUTHORIZATION_INFORMATION","REGISTRANT","ADMINISTRATIVE_CONTACTS","TECHNICAL_CONTACTS","HOST_NAMES","LIMITATION","WHOIS_STATUS"]}
        required: true
      responses:
        '200':
          description: Successfully started export creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExportRegistrarResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorDto'
      security:
        - keycloak: []
  /v1/registrar/registry-lock/domains:
    get:
      tags:
        - registry-lock-domain-registrar-controller
      summary: List registrar's registry locked domains
      operationId: list_14_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: search
          in: query
          description: value for the searchField
        - name: searchField
          in: query
          description: type of field you want to search on
          schema:
            default: DOMAIN_NAME
            enum:
              - DOMAIN_NAME
              - REGISTRANT_CLIENT_ID
        - name: stringSearchType
          in: query
          description: operator of search
          schema:
            default: LIKE
            enum:
              - EQUALS
              - LIKE
        - name: dateField
          in: query
          description: if you want to search with date
          schema:
            default: CREATION_DATE
            enum:
              - TEMPORARY_UNLOCK_DATE
              - CREATION_DATE
              - UPDATE_DATE
        - name: startDate
          in: query
          description: specify a starting date for your search with dateField
        - name: endDate
          in: query
