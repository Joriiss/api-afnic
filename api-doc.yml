    post:
      tags:
        - contact-registrar-controller
      summary: Create a contact
      operationId: create_23_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FRNIC_V2 required to manage .fr specific data)
          required: true
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: contact object that needs to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreateDto'
            examples:
              contactcreate1:
                summary: create a moral contact with facultative company data (SIREN)
                value: {"email":"test@lala.fr","telephoneNumber":"+33.616808073","authorizationInformation":"example","localizedPostalInfo":{"contactName":"Test","organizationName":"Afnic","postalAddress":{"firstStreet":"1 rue du test","secondStreet":"CEDEX","complementaryStreet":"78415","cityName":"Magnoncourt","stateOrProvinceName":"Hauts-de-France","postalCode":"59800","countryCode":"FR"}},"extensions":{"frnic":{"moral":{"legalStatus":"COMPANY","siren":123456789}}}}
              contactcreate2:
                summary: create a moral contact with all the mandatory fields
                value: {"email":"example@nature.fr","telephoneNumber":"+33.167545632","authorizationInformation":"example","localizedPostalInfo":{"contactName":"Test","postalAddress":{"firstStreet":"1 rue du test 1637920527787","cityName":"Sionne","postalCode":"88630","countryCode":"FR"}},"extensions":{"frnic":{"moral":{"legalStatus":"OTHER"}}}}
              contactcreate3:
                summary: create an individual contact with all the mandatory fields
                value: {"email":"example@nature.fr","telephoneNumber":"+33.167545632","authorizationInformation":"example","localizedPostalInfo":{"contactName":"Lepers","postalAddress":{"firstStreet":"1 rue du test 1637920527787","cityName":"Sionne","postalCode":"88630","countryCode":"FR"}},"extensions":{"frnic":{"physical":{"firstName": "Julien"}}}}
        required: true
      responses:
        '201':
          description: Successfully created contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCreateResponseDto'
        '400':
          description: 'Impossible request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
      security:
        - keycloak: []
    patch:
      tags:
        - contact-registrar-controller
      summary: Update a contact
      operationId: update_28_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1_1
      parameters:
        - name: extensions
          in: header
          description: specify an EPP extension if needed (FRNIC_V2 to manage .fr specific data)
          required: false
          schema:
            uniqueItems: true
            type: array
            items:
              type: string
        - name: CLIENT_REQUEST_ID
          in: header
          description: specifiy a request identifier
      requestBody:
        description: Contact object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdateDto'
            examples:
              contactupdate1:
                summary: change the phone number of a contact
                value: {"clientId": "C8711","telephoneNumber": "+33.145784578"}
              contactupdate2:
                summary: change the eligibility and reachability of a contact (FRNIC_V2 needed)
                value: {"clientId": "C8711","extensions":{"frnic":{"eligibilityVerified": true,"reachable": {"reachable": true,"medium": "voice"}}}}
              contactupdate3:
                summary: adding an EPP status
                value: {"clientId": "C8711","addEppStatuses": ["CLIENT_UPDATE_PROHIBITED"]}
              contactupdate4:
                summary: change the postal address and the email
                value: {"clientId": "C8711","localizedPostalInfo": {"postalAddress": {"firstStreet": "1 rue de la paix","secondStreet": "CEDEX","cityName": "Dada","postalCode": "47414","countryCode": "FR"}},"email":"test@example.fr"}
        required: true
      responses:
        '200':
          description: Successfully updated contact object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSimpleResponseDto'
        '400':
          description: 'Bad request, please check your command'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
        '404':
          description: 'Not found, please check your command'
          content:
            application/json:
              schema:
                type: string
        '500':
          description: An internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorsDto'
      security:
        - keycloak: []
